  <body class="login-page">
    <div id="page-loading" class="page-loading" role="status" aria-label="正在载入">
      <div class="page-loading-content">
        <div class="page-loading-rings" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="page-loading-title">明日之后“愿”营地助手</p>
        <div class="page-loading-progress" role="progressbar" aria-label="载入进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="page-loading-bar"></div>
          <span class="page-loading-percent">0%</span><span class="page-loading-percent-contrast" aria-hidden="true">0%</span>
        </div>
        <p class="page-loading-message">正在载入…</p>
        <div class="page-loading-actions" hidden><button class="button button-primary" type="button" data-loading-retry>重新载入</button><button class="button button-quiet" type="button" data-loading-continue>继续查看</button></div>
      </div>
    </div>
    <a class="skip-link" href="#main-content">跳至主要内容</a>
    <main id="main-content" class="login-shell" tabindex="-1">
      <section class="panel login-card">
        <a class="brand login-brand" href="/">
          <span class="brand-mark">愿</span>
          <span>
            <strong>明日之后“愿”营地助手</strong>
            <small>Camp Operations Console</small>
          </span>
        </a>
        <div class="login-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg></div>
        <p class="eyebrow">CAMP OPERATIONS</p>
        <h1>进入管理后台</h1>
        <p class="muted">
          营地配置、任务执行与中断操作仅向授权的 Yume Account 开放。
        </p>
        <a id="oidc-login" class="button button-primary button-wide" href="/auth/oidc/start">
          使用 Yume Account 登录
        </a>
        <div id="key-login-section" class="key-login-section" hidden>
          <div class="login-divider"><span>或使用临时 Key</span></div>
          <form id="key-login-form">
            <label class="field">
              <span>临时 Key</span>
              <input id="temporary-key" type="password" autocomplete="off" required />
            </label>
            <button class="button button-quiet button-wide" type="submit">使用 Key 登录</button>
          </form>
        </div>
        <p id="login-error" class="feedback error-text" role="alert"></p>
        <a class="back-link" href="/">← 返回公共首页</a>
      </section>
    </main>
    <footer class="site-footer">
      <div class="power" data-footer-copy>
        Copyright © <a href="https://www.yume.zone/">Yume Internet LLC</a>. All Rights Reserved.
      </div>
      <div class="lrc" hidden></div>
    </footer>
    <iframe id="oidc-silent-frame" title="" hidden></iframe>
